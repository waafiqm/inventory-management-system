# ============================================================
# IMS - Kubernetes Deployment + Internal Services File
# Images: waafiqmaz/waafiqims
# KubeMQ gRPC ClusterIP: 34.118.228.156:50000
# ============================================================

# -----------------------------------------------
# ACCOUNT DB - PVC
# -----------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: accountdb-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
# ACCOUNT DB - Service
apiVersion: v1
kind: Service
metadata:
  name: accountdb
spec:
  selector:
    app: accountdb
  ports:
    - port: 3306
      targetPort: 3306
---
# ACCOUNT DB - Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accountdb
spec:
  selector:
    matchLabels:
      app: accountdb
  template:
    metadata:
      labels:
        app: accountdb
    spec:
      containers:
        - name: accountdb
          image: waafiqmaz/waafiqims:accountdb
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: storage
              mountPath: /data/accountdb
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: accountdb-pvc
---
