# -----------------------------------------------
# FRONTEND SERVICE - Deployment
# -----------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: waafiqmaz/waafiqims:frontendservice-v6
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: accountdb:3306
            - name: kubeMQAddress
              value: 34.118.228.156:50000
            - name: lowStockService
              value: lowstockservice:80
            - name: inventoryService
              value: inventoryservice
          imagePullPolicy: Always
---
# -----------------------------------------------
# INVENTORY SERVICE - ClusterIP Service
# -----------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: inventoryservice
spec:
  selector:
    app: inventoryservice
  ports:
    - port: 80
      targetPort: 8080
---
# -----------------------------------------------
# LOW STOCK SERVICE - ClusterIP Service
# -----------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: lowstockservice
spec:
  selector:
    app: lowstockservice
  ports:
    - port: 80
      targetPort: 8080
---
# -----------------------------------------------
# FRONTEND - LoadBalancer Service (public IP)
# -----------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
