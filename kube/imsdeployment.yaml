# -----------------------------------------------
# LOW STOCK DB - PVC
# -----------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lowstockdb-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
# LOW STOCK DB - Service
apiVersion: v1
kind: Service
metadata:
  name: lowstockdb
spec:
  selector:
    app: lowstockdb
  ports:
    - port: 3306
      targetPort: 3306
---
# LOW STOCK DB - Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lowstockdb
spec:
  selector:
    matchLabels:
      app: lowstockdb
  template:
    metadata:
      labels:
        app: lowstockdb
    spec:
      containers:
        - name: lowstockdb
          image: waafiqmaz/waafiqims:lowstockdb
          ports:
            - containerPort: 3306
          volumeMounts:
