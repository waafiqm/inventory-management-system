---
# -----------------------------------------------
# INVENTORY SERVICE - Deployment
# -----------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventoryservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventoryservice
  template:
    metadata:
      labels:
        app: inventoryservice
    spec:
      containers:
        - name: inventoryservice
          image: waafiqmaz/waafiqims:inventoryservice-v2
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: inventorydb:3306
            - name: kubeMQAddress
              value: 34.118.228.156:50000
            - name: lowStockService
              value: lowstockservice:80
          imagePullPolicy: Always
---
